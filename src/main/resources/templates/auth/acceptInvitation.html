<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'login')}">
<body>

<h2 class="text-center">
  <span class="fa fa-user-plus"></span> Set Up Your Account
</h2>

<div class="container mt-4" style="max-width: 500px;">

  <div th:if="${messageDanger}" class="alert alert-danger" th:text="${messageDanger}"></div>

  <p class="text-muted">
    Welcome, <strong th:text="${customerName}">Customer</strong>!
    Create a password to access your WeFixCar portal.
  </p>

  <form th:action="@{/invite/accept}" method="post" class="form-horizontal">
    <input type="hidden" name="token" th:value="${token}"/>

    <div class="form-group">
      <label class="col-sm-2 control-label">Email</label>
      <div class="col-sm-10">
        <input type="email" class="form-control" th:value="${email}" readonly/>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">Phone</label>
      <div class="col-sm-10">
        <input type="text" class="form-control" th:value="${phone}" readonly/>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">Password</label>
      <div class="col-sm-10">
        <input type="password" name="password" class="form-control" placeholder="At least 8 characters"/>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">Confirm Password</label>
      <div class="col-sm-10">
        <input type="password" name="confirmPassword" class="form-control" placeholder="Re-enter your password"/>
      </div>
    </div>

    <div class="d-grid gap-2 mt-4">
      <button type="submit" class="btn btn-primary btn-lg">
        <span class="fa fa-check"></span> Create Account
      </button>
    </div>

  </form>
</div>

</body>
</html>
