# Supabase (PostgreSQL) connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed manually in Supabase — do not run on startup
spring.sql.init.mode=never

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.platform=postgres

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl

# Internationalization
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8

# Actuator
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# Set to dev locally, and prod on a cloud server
spring.profiles.active=postgres

# Disable Whitelabel error page so custom error templates are used
#server.error.whitelabel.enabled=false

azure.communication.connection-string=${AZURE_COMMUNICATION_CONNECTION_STRING}
azure.communication.sender-email=${AZURE_COMMUNICATION_SENDER_EMAIL}
app.base-url=http://localhost:8080

